[workspace]
members = [
    "crates/rctx-core",
    "crates/rhist-core",
    "crates/rhist-io",
    "crates/rhist-cli",
    "crates/rgraph-core",
    "crates/rfacility-core",
    "crates/rstat-core",
    "crates/rmath-core",
    "crates/ropt-core",
    "crates/rline-core",
    "crates/rline-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["giodl73"]
license = "MIT"
repository = "https://github.com/giodl73-repo/RLINE"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
rand = { version = "0.8", features = ["small_rng"] }
rline-core = { path = "crates/rline-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3"
thiserror = "2.0"

